<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARADOX MAFIA Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #bb86fc;
            margin-bottom: 20px;
        }
        .card {
            background: #1e1e2e;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        button {
            background: #bb86fc;
            color: #121212;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>🎭 PARADOX MAFIA</h1>
    <div class="card">
        <h3>👤 Profil</h3>
        <p id="user-name">Yuklanmoqda...</p>
    </div>
    <div class="card">
        <h3>🛒 Do'kon</h3>
        <p>Maska sotib oling va tunda o'zingizni yashiring!</p>
        <button onclick="buyItem('buy_mask')">🎭 Maska sotib olish (1 💎)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        } else {
            document.getElementById('user-name').innerText = "O'yinchi";
        }

        function buyItem(item) {
            tg.sendData(item);
            tg.close();
        }
    </script>
</body>
  </html>
